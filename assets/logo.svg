<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Chuleta">
  <defs>
    <linearGradient id="pitch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f7a3f"/>
      <stop offset="1" stop-color="#145a2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#pitch)"/>
  <!-- pitch stripes -->
  <g fill="#ffffff" opacity="0.06">
    <rect x="8" y="56" width="240" height="24"/>
    <rect x="8" y="104" width="240" height="24"/>
    <rect x="8" y="152" width="240" height="24"/>
    <rect x="8" y="200" width="240" height="24"/>
  </g>
  <!-- halfway line and centre circle -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3">
    <line x1="8" y1="128" x2="248" y2="128"/>
    <circle cx="128" cy="128" r="34"/>
  </g>
  <!-- the crib sheet: a tilted note with a folded corner -->
  <g transform="rotate(-8 128 128)" filter="url(#shadow)">
    <path d="M70 62 h96 l30 30 v102 a10 10 0 0 1 -10 10 h-116 a10 10 0 0 1 -10 -10 v-122 a10 10 0 0 1 10 -10 z" fill="#fff8e7"/>
    <path d="M166 62 v30 h30 z" fill="#e6d7b5"/>
    <!-- ruled lines -->
    <g stroke="#c9b892" stroke-width="3" stroke-linecap="round">
      <line x1="86" y1="112" x2="140" y2="112"/>
      <line x1="86" y1="134" x2="170" y2="134"/>
      <line x1="86" y1="156" x2="126" y2="156"/>
    </g>
    <!-- rising value line with arrow -->
    <polyline points="86,182 112,166 130,174 154,148 176,140" fill="none" stroke="#1f7a3f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M166 132 l18 6 l-6 18 z" fill="#1f7a3f"/>
  </g>
</svg>
